<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Form pendaftaran akun dengan berbagai jenis input HTML.">
  <meta name="author" content="Martha Saulina Nababan">
  <title>Form Pendaftaran Akun</title>
</head>
<body>

  <!-- Navigasi utama (sama di semua halaman) -->
  <header>
    <nav>
      <a href="proyek.html">Beranda</a> |
      <a href="index.html">IMDb Top 3 Movies</a> |
      <a href="blog.html">Dev Blogs</a> |
      <a href="form.html">Form Pendaftaran</a> |
      <a href="cv.html">CV</a>
    </nav>
  </header>
  <hr>

  <main>
    <h1>Form Pendaftaran Akun</h1>

    <form action="#" method="post">
      <fieldset>
        <legend>Daftar Akun</legend>

        <!-- Input teks -->
        <p>
          <label for="nama">Nama Lengkap:</label>
          <input type="text" id="nama" name="nama_lengkap" placeholder="Masukkan nama lengkap" maxlength="50" required>
        </p>

        <!-- Input radio, tiap opsi diberi br agar tampil satu per baris -->
        <p>
          <span>Jenis Kelamin:</span><br>
          <input type="radio" id="lk" name="jenis_kelamin" value="Laki-Laki" required>
          <label for="lk">Laki-Laki</label><br>
          <input type="radio" id="pr" name="jenis_kelamin" value="Perempuan">
          <label for="pr">Perempuan</label>
        </p>

        <p>
          <label for="tempat_lahir">Tempat Lahir:</label>
          <input type="text" id="tempat_lahir" name="tempat_lahir" maxlength="50" required>
        </p>

        <!-- Input tanggal -->
        <p>
          <label for="tgl_lahir">Tanggal Lahir:</label>
          <input type="date" id="tgl_lahir" name="tanggal_lahir" required>
        </p>

        <!-- Dropdown pilihan -->
        <p>
          <label for="agama">Agama:</label>
          <select id="agama" name="agama" required>
            <option value="">--- Pilih Agama ---</option>
            <option value="Islam">Islam</option>
            <option value="Katolik">Katolik</option>
            <option value="Protestan">Protestan</option>
            <option value="Hindu">Hindu</option>
            <option value="Buddha">Buddha</option>
            <option value="Konghucu">Konghucu</option>
          </select>
        </p>

        <!-- Input checkbox, tiap opsi diberi br agar tampil satu per baris -->
        <p>
          <span>Hobi:</span><br>
          <input type="checkbox" id="olahraga" name="hobi" value="Olahraga">
          <label for="olahraga">Olahraga</label><br>
          <input type="checkbox" id="membaca" name="hobi" value="Membaca">
          <label for="membaca">Membaca</label><br>
          <input type="checkbox" id="ngoding" name="hobi" value="Ngoding">
          <label for="ngoding">Ngoding</label>
        </p>

        <!-- Input password -->
        <p>
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" minlength="8" required>
        </p>

        <hr>

        <p>
          <input type="checkbox" id="setuju" name="persetujuan" value="setuju" required>
          <label for="setuju">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
        </p>

        <!-- Tombol reset dan submit -->
        <p>
          <input type="reset" value="Reset">
          <input type="submit" value="Submit">
        </p>

      </fieldset>
    </form>
  </main>

</body>
</html>
